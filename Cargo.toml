[package]
name = "wawona-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT"
description = "Wawona in-process WASI P1/P2 interpreter (Pulley on Apple mobile, Cranelift on macOS)."
repository = "https://github.com/Wawona/wwn-wasm"
authors = ["Alex Spaulding"]

[lib]
name = "wawona_wasm"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "wasm"
path = "src/bin/wasm.rs"

[features]
default = ["pulley"]
# Apple mobile / Android: compile WASM → Pulley IR (needs the cranelift
# frontend) then interpret. Config::target("pulley64") prevents native ARM.
pulley = ["wasmtime/pulley", "wasmtime/cranelift"]
# macOS host Cranelift (native). Do not use this feature on iphoneos recipes.
cranelift-native = ["wasmtime/cranelift"]

[dependencies]
anyhow = "1"
libc = "0.2"
# default-features off: no Cranelift native, no cache, no parallel compile.
wasmtime = { version = "33", default-features = false, features = [
  "runtime",
  "component-model",
  "gc",
  "std",
] }
wasmtime-wasi = { version = "33", default-features = false, features = [
  "preview1",
] }

[profile.release]
opt-level = 2
lto = false
codegen-units = 1
# Never abort: catch_unwind at the C ABI (same as phoon_main).
panic = "unwind"
