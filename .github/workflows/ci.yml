name: ci
on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cargo:
    name: cargo check + test (Pulley)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: verify iOS recipe is Pulley-only
        run: python3 .github/scripts/verify-wasm-ios-patches.py
      - name: check (Pulley)
        run: cargo check --no-default-features --features pulley
      - name: test (sandbox)
        run: cargo test --no-default-features --features pulley --lib

  eval:
    name: flake eval (instantiation)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: fragment evaluates
        run: nix eval .#registryFragment --apply builtins.attrNames
